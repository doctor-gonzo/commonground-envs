[project]
name = "commonground-envs"
version = "0.0.0"
description = "Workspace for Common Ground deliberation evaluation environments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "commonground-scenarios==0.6.1",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".codex",
    "environments/*/outputs",
    "packages/commonground-score/tests/fixtures",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
files = [
    "packages/commonground-score/src",
    "packages/commonground-scenarios/src",
    "environments/commonground_elicit/commonground_elicit",
    "environments/commonground_predict/commonground_predict",
    "environments/commonground_predict/scripts",
    "scripts",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["datasets", "verifiers", "verifiers.*"]
ignore_missing_imports = true

[tool.uv]
required-version = "==0.10.9"

[tool.uv.workspace]
members = [
    "packages/commonground-score",
    "packages/commonground-scenarios",
    "environments/commonground_elicit",
    "environments/commonground_predict",
]

[tool.uv.sources]
commonground-scenarios = { workspace = true }
commonground-score = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/commonground-score/tests",
    "packages/commonground-scenarios/tests",
    "environments/commonground_elicit/tests",
    "environments/commonground_predict/tests",
]
