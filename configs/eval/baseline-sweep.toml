# Native Verifiers v1 evaluates one taskset per invocation. This file selects
# Predict; override env.taskset.id with commonground-elicit for the Elicit run.
# Supply the model at invocation time. Native runs always save config.toml and
# traces.jsonl, so no save-results switch is needed.
num_tasks = 100
num_rollouts = 5
shuffle = false
push = false

[env.taskset]
id = "commonground-predict"
split = "eval"
