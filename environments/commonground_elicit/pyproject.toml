[project]
name = "commonground-elicit"
version = "0.6.0"
description = "Structured policy-issue diagnosis and single-target clarification over synthetic stakeholder scenarios."
authors = [{ name = "Common Ground contributors" }]
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = ["social-reasoning", "elicitation", "deterministic", "single-turn"]
tags = ["social-reasoning", "elicitation", "document-analysis", "deterministic", "single-turn", "train", "eval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "commonground-scenarios==0.6.0",
    "commonground-score==0.6.0",
    "datasets>=5.0.1,<6.0.0",
    "verifiers==0.3.0",
]

[project.urls]
Repository = "https://github.com/doctor-gonzo/commonground-envs"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "commonground_elicit/**",
]

[tool.verifiers.eval]
num_examples = 100
rollouts_per_example = 1
