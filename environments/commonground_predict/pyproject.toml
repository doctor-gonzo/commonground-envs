[project]
name = "commonground-predict"
version = "0.1.2"
description = "Common Ground masked-vote prediction environment for Verifiers."
authors = [{ name = "Common Ground contributors" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = ["social-reasoning", "prediction", "deterministic", "single-turn"]
tags = ["social-reasoning", "vote-prediction", "deterministic", "single-turn", "train", "eval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "commonground-score>=0.1.0,<0.2",
    "verifiers==0.1.14",
]

[project.urls]
Repository = "https://github.com/doctor-gonzo/commonground-envs"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "commonground_predict/**",
    "pyproject.toml",
]

[tool.verifiers.eval]
num_examples = 20
rollouts_per_example = 1
